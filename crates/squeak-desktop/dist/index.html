<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>squeak</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="status">
    <span class="brand">
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="sqlogo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#89b4fa"/>
            <stop offset="0.55" stop-color="#cba6f7"/>
            <stop offset="1" stop-color="#f38ba8"/>
          </linearGradient>
        </defs>
        <circle cx="168" cy="170" r="68" fill="url(#sqlogo)"/>
        <circle cx="344" cy="170" r="68" fill="url(#sqlogo)"/>
        <circle cx="256" cy="300" r="135" fill="url(#sqlogo)"/>
        <circle cx="214" cy="286" r="15" fill="var(--bg)"/>
        <circle cx="298" cy="286" r="15" fill="var(--bg)"/>
        <path d="M250 330 l40 34 -16 4 8 22 -12 5 -9 -22 -13 11z" fill="var(--bg)"/>
      </svg>
      squeak
    </span>
    <span class="sep">│</span>
    <span id="device" class="dev">connecting…</span>
    <span id="meta" class="meta"></span>
    <span class="spacer"></span>
    <span class="gauge" id="batt-gauge"></span>
    <span id="batt" class="batt"></span>
  </header>

  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main id="screen"></main>
  </div>

  <footer class="keys" id="keys"></footer>

  <div id="toast" class="toast"></div>

  <script src="main.js"></script>
</body>
</html>
